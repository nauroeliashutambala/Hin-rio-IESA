<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <title>Hinário da IESA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    header {
      background-color: #f8f8f8; /* Fundo do cabeçalho, similar à imagem */
      padding: 10px 15px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 10px;
    }
    .header-top i {
      font-size: 24px;
      color: #FFD700; /* Cor dourada para os ícones */
    }
    .header-top nav img {
      width: 30px;
      height: 30px;
    }
    .logo {
      width: 80px;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }
    h2 {
      margin: 10px 0 0;
      color: #333;
    }
    section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      padding: 20px;
    }
    .card {
      background-color: white;
      text-align: center;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-decoration: none;
      color: #333;
    }
    .card img {
      width: 50px;
      height: 50px;
      margin-bottom: 10px;
    }
    .card p {
      margin: 0;
      font-weight: bold;
    }
    footer {
      text-align: center;
      padding: 15px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <i class="fa-solid fa-bars"></i>
      <i class="fa-solid fa-info-circle"></i>
    </div>
    <img src="assets/img/logo.png" class="logo" alt="Logotipo IESA - IGREJA EVANGELICA SINODAL DE ANGOLA"/>
    <h2>Hinário da IESA</h2>
  </header>
  <section>
  </section>
  <footer>
     NauroVibes @ 2025 
    Todos os direitos reservados
  </footer>
  <script>
  let itens_list =[
  {titulo: "Hinos", img : "musical-note.png"},
  {titulo: "Chamada para adoração", img : "open-book.png"},
  {titulo: "Suplica geral", img : "folded.png"},
  {titulo: "Lituania", img : "calendar.png"},
  {titulo: "Definiçães", img : "recent.png"},
  {titulo: "Favoritos", img : "heart.png"}
  ];
  let sec = document.querySelector("section");
  for(let i= 0; i < itens_list.length; i++){
    sec.innerHTML +=`
    <a href="#" class="card" >
    <img src="/${itens_list[i].img}" />
    <p>${itens_list[i].titulo}</p>
  </a>
    `
  }
  </script>
</body>
</html>
